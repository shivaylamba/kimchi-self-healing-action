name: 'Kimchi Self-Healing Action'
description: |
  Automatically diagnose and repair failing CI pipelines using Kimchi.
  Run this action after your test step to let Kimchi investigate failures,
  patch code, and open a Pull Request with the fix.
author: 'shivaylamba'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  api-key:
    description: 'Kimchi API key. Set this as a repository secret (KIMCHI_API_KEY).'
    required: true

  test-command:
    description: |
      Command to run tests.
      Examples: npm test, pytest, go test ./..., make test
    required: false
    default: 'npm test'

  working-directory:
    description: |
      Directory where tests are run, relative to the repository root.
      Defaults to repository root.
    required: false
    default: '.'

  branch-prefix:
    description: 'Prefix for the auto-fix branch name.'
    required: false
    default: 'kimchi-auto-fix-'

  pr-title:
    description: 'Title for the auto-fix Pull Request.'
    required: false
    default: '[Kimchi Auto-Fix] Resolve failing CI pipeline'

  commit-message:
    description: 'Commit message for the auto-fix commit.'
    required: false
    default: |
      [Kimchi Auto-Fix] Resolve failing CI pipeline

      This commit contains an automated fix generated by Kimchi Ferment.
      The agent analyzed the test failure, identified the root cause,
      and applied the minimal code change necessary to make the tests pass.

  safety-mode:
    description: 'Enable safety guards during repair.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # ── 1. Detect the workspace root ───────────────────────────────────
    - name: Detect workspace root
      id: vars
      shell: bash
      run: |
        WORKSPACE="${{ github.workspace }}"
        WORKDIR="${{ inputs.working-directory }}"
        FULL_WORKDIR="${WORKSPACE}/${WORKDIR}"
        mkdir -p "${WORKSPACE}/.kimchi-tmp"
        echo "workspace=${WORKSPACE}" >> $GITHUB_OUTPUT
        echo "full-workdir=${FULL_WORKDIR}" >> $GITHUB_OUTPUT
        echo "tmp-dir=${WORKSPACE}/.kimchi-tmp" >> $GITHUB_OUTPUT
        echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

    # ── 2. Run tests and capture output ────────────────────────────────
    - name: Run tests and capture failure log
      id: tests
      shell: bash
      working-directory: ${{ steps.vars.outputs.full-workdir }}
      run: |
        TMP_DIR="${{ steps.vars.outputs.tmp-dir }}"
        echo "[self-heal] Running tests: ${{ inputs.test-command }}"
        ${{ inputs.test-command }} > "${TMP_DIR}/failure.log" 2>&1 || true
        echo "[self-heal] Test run finished."

    # ── 3. Check whether tests failed ──────────────────────────────────
    - name: Check for test failures
      id: check-failure
      shell: bash
      run: |
        TMP_DIR="${{ steps.vars.outputs.tmp-dir }}"
        if grep -qiE 'fail|error|FAIL' "${TMP_DIR}/failure.log"; then
          echo "failed=true" >> $GITHUB_OUTPUT
          echo "[self-heal] Test failures detected."
        else
          echo "failed=false" >> $GITHUB_OUTPUT
          echo "[self-heal] Tests passed. No healing needed."
        fi

    # ── 4. Install Kimchi CLI ──────────────────────────────────────────
    - name: Install Kimchi CLI
      if: steps.check-failure.outputs.failed == 'true'
      shell: bash
      run: |
        if command -v kimchi &>/dev/null; then
          echo "[self-heal] Kimchi already installed: $(kimchi --version)"
          exit 0
        fi
        echo "[self-heal] Installing Kimchi CLI..."
        curl -fsSL https://github.com/getkimchi/kimchi/releases/latest/download/kimchi_linux_amd64.tar.gz | sudo tar xz -C /usr/local
        echo "[self-heal] Kimchi CLI installed:"
        kimchi --version

    # ── 5. Run Kimchi repair agent ─────────────────────────────────────
    - name: Run Kimchi repair agent
      if: steps.check-failure.outputs.failed == 'true'
      shell: bash
      env:
        KIMCHI_API_KEY: ${{ inputs.api-key }}
        KIMCHI_SAFE_MODE: ${{ inputs.safety-mode }}
      run: |
        ${{ github.action_path }}/scripts/run-kimchi.sh \
          --failure-log "${{ steps.vars.outputs.tmp-dir }}/failure.log" \
          --working-directory "${{ steps.vars.outputs.full-workdir }}" \
          --api-key "${{ inputs.api-key }}"

    # ── 6. Create Pull Request ─────────────────────────────────────────
    - name: Create Pull Request
      if: steps.check-failure.outputs.failed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        WORKSPACE="${{ steps.vars.outputs.workspace }}"
        if git -C "${WORKSPACE}" diff --quiet && git -C "${WORKSPACE}" diff --cached --quiet; then
          echo "[self-heal] No changes were made by Kimchi. Skipping PR."
          exit 0
        fi
        ${{ github.action_path }}/scripts/create-pr.sh \
          --branch-prefix "${{ inputs.branch-prefix }}" \
          --base-branch "${{ steps.vars.outputs.branch }}" \
          --title "${{ inputs.pr-title }}" \
          --commit-message "${{ inputs.commit-message }}" \
          --working-directory "${WORKSPACE}"
