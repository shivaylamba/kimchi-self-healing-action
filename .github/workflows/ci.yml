name: Lint & Test Scripts

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: '-verbose'
          fail_on_error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bats-core
        run: |
          echo "[ci] Installing bats-core..."
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo bash /tmp/bats/install.sh /usr/local
          bats --version

      - name: Install bats helpers
        run: |
          echo "[ci] Installing bats helper libraries..."
          mkdir -p tests/test_helper
          git clone --depth 1 https://github.com/bats-core/bats-support.git tests/test_helper/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert.git tests/test_helper/bats-assert
          git clone --depth 1 https://github.com/bats-core/bats-file.git tests/test_helper/bats-file

      - name: Run bats tests
        run: |
          if [ -d "tests/bats" ] && [ "$(ls -A tests/bats/*.bats 2>/dev/null)" ]; then
            bats tests/bats/
          else
            echo "[ci] No bats tests found yet. Skipping."
          fi
